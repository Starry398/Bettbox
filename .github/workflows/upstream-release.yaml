
name: Upstream Release

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bettbox-upstream-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.25.x'
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - name: Find latest stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/appshubcc/Bettbox/releases/latest")

          TAG=$(echo "$RELEASE" | jq -er '.tag_name')

          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected stable release tag: $TAG"
            exit 1
          fi

          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet. Build required."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Bettbox Android ARM64
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout upstream release source
        uses: actions/checkout@v6
        with:
          repository: appshubcc/Bettbox
          ref: ${{ needs.check-release.outputs.tag }}
          fetch-depth: 0
          submodules: recursive
          path: upstream

      - name: Checkout custom XML files
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: custom-files
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Restore custom XML resources
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="../custom-files/.github"
          TARGET="android/app/src/main/res/drawable"

          for file in \
            splash_text_dark.xml \
            splash_text_light.xml \
            ic_launcher_foreground_dark.xml \
            ic_launcher_foreground_light.xml
          do
            if [ ! -f "$SOURCE/$file" ]; then
              echo "::error::Missing custom XML: $SOURCE/$file"
              exit 1
            fi

            if [ ! -f "$TARGET/$file" ]; then
              echo "::error::Upstream resource not found: $TARGET/$file"
              exit 1
            fi

            cp "$SOURCE/$file" "$TARGET/$file"
            echo "Restored $file"
          done

      - name: Read application version
        id: version
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION=$(sed -nE \
            's/^version:[[:space:]]*([^+[:space:]]+)(\+[0-9]+)?[[:space:]]*$/\1/p' \
            pubspec.yaml | head -n 1)

          if [ -z "$APP_VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $APP_VERSION"

      - name: Set Android build number
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E \
            "s/^(version:[[:space:]]*[^+[:space:]]+)(\+[0-9]+)?[[:space:]]*$/\1+${GITHUB_RUN_NUMBER}/" \
            pubspec.yaml

          grep '^version:' pubspec.yaml

      - name: Set custom application ID
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle.kts"

          if ! grep -Fq \
            'applicationId = "com.appshub.bettbox"' "$FILE"; then
            echo "::error::Expected upstream applicationId was not found."
            exit 1
          fi

          sed -i \
            's/applicationId = "com.appshub.bettbox"/applicationId = "com.appshub.bettbox.starry"/' \
            "$FILE"

          grep 'applicationId =' "$FILE"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="28.2.13676358"

          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true

          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Android NDK not found: $NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          EOF

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: upstream/core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Clear Pub Cache Credentials
        shell: bash
        run: |
          rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Setup Android signing
        working-directory: upstream
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE" | base64 --decode \
            > android/app/keystore.jks

          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

          keytool -list \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Clean Android build
        working-directory: upstream
        shell: bash
        run: flutter clean

      - name: Build Bettbox Android ARM64
        working-directory: upstream
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail

          flutter pub get
          dart run build_runner build
          dart setup.dart android --arch arm64 --env stable

      - name: Verify APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(dist/*.apk)

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK files found in dist/"
            exit 1
          fi

          printf '%s\n' "${APK_FILES[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-Android-ARM64-${{ needs.check-release.outputs.tag }}
          path: upstream/dist/*.apk
          if-no-files-found: error
          archive: false
          overwrite: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" upstream/dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"