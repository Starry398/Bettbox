name: apk

on:
workflow_dispatch:
inputs:
release_type:
description: "选择发布类型"
required: true
type: choice
options:
- pre
- stable
default: pre

permissions:
contents: write

concurrency:
group: bettbox-build
cancel-in-progress: false

env:
GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

jobs:
build:
name: Build Bettbox Android ARM64
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      fetch-tags: true

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      flutter-version: "3.47.7"
      cache: true

  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: "1.25.x"
      cache: true

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Android NDK
    uses: nttld/setup-ndk@v1
    with:
      ndk-version: "28.2.13676358"
      add-to-path: true

  - name: Setup Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: aarch64-linux-android

  - name: Flutter clean
    run: flutter clean

  - name: Flutter dependencies
    run: flutter pub get

  - name: Generate code
    run: dart run build_runner build --delete-conflicting-outputs

  - name: Setup Bettbox Android
    run: dart setup.dart android --arch arm64 --env stable

  - name: Configure application ID
    shell: bash
    run: |
      set -euo pipefail

      sed -i -E \
        's/applicationId = "com\.appshub\.bettbox[^"]*"/applicationId = "com.appshub.bettbox.sky"/' \
        android/app/build.gradle.kts

      grep -q \
        'applicationId = "com.appshub.bettbox.sky"' \
        android/app/build.gradle.kts

      echo "Application ID configured."

  - name: Setup Android signing
    shell: bash
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      set -euo pipefail

      if [ -z "$KEYSTORE" ] || \
         [ -z "$KEY_ALIAS" ] || \
         [ -z "$STORE_PASSWORD" ] || \
         [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: Android signing secrets are missing."
        exit 1
      fi

      mkdir -p android/app
      printf '%s' "$KEYSTORE" | base64 --decode \
        > android/app/keystore.jks

      test -s android/app/keystore.jks
      touch android/local.properties

      {
        echo "storePassword=$STORE_PASSWORD"
        echo "keyPassword=$KEY_PASSWORD"
        echo "keyAlias=$KEY_ALIAS"
      } >> android/local.properties

      echo "Android signing configuration created."

  - name: Verify Android keystore
    shell: bash
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    run: |
      set -euo pipefail

      keytool -list \
        -keystore android/app/keystore.jks \
        -storepass "$STORE_PASSWORD" \
        -alias "$KEY_ALIAS" >/dev/null

      echo "Keystore and alias verified."

  - name: Read version and prepare release
    id: release_info
    shell: bash
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
    run: |
      set -euo pipefail

      VERSION=$(sed -nE \
        's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' \
        pubspec.yaml | head -n 1)

      if [ -z "$VERSION" ]; then
        echo "ERROR: Cannot read version from pubspec.yaml."
        exit 1
      fi

      if [ "$RELEASE_TYPE" = "pre" ]; then
        EXISTING=$(git ls-remote --tags origin \
          "refs/tags/v${VERSION}-pre*" |
          sed -nE "s#.*refs/tags/v${VERSION}-pre([0-9]+)$#\1#p" |
          sort -n | tail -n 1)

        if [ -z "$EXISTING" ]; then
          PRE_NUMBER=1
        else
          PRE_NUMBER=$((EXISTING + 1))
        fi

        TAG="v${VERSION}-pre${PRE_NUMBER}"
        RELEASE_NAME="Bettbox ${VERSION} pre${PRE_NUMBER}"
        PRERELEASE=true
      elif [ "$RELEASE_TYPE" = "stable" ]; then
        TAG="v${VERSION}"
        RELEASE_NAME="Bettbox ${VERSION}"
        PRERELEASE=false
      else
        echo "ERROR: Unknown release type."
        exit 1
      fi

      BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
      echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      echo "Version: $VERSION"
      echo "Build number: $BUILD_NUMBER"
      echo "Tag: $TAG"
      echo "Release: $RELEASE_NAME"
      echo "Pre-release: $PRERELEASE"

  - name: Configure build number
    shell: bash
    env:
      APP_VERSION: ${{ steps.release_info.outputs.version }}
      BUILD_NUMBER: ${{ steps.release_info.outputs.build_number }}
    run: |
      set -euo pipefail

      sed -i -E \
        "s/^version:.*/version: ${APP_VERSION}+${BUILD_NUMBER}/" \
        pubspec.yaml

  - name: Verify release signing configuration
    shell: bash
    run: |
      set -euo pipefail

      grep -q 'create("release")' \
        android/app/build.gradle.kts

      grep -q \
        'signingConfig = signingConfigs.getByName(if (isRelease) "release" else "debug")' \
        android/app/build.gradle.kts

      echo "Gradle signing configuration checked."

  - name: Build release APK
    shell: bash
    env:
      APP_VERSION: ${{ steps.release_info.outputs.version }}
      BUILD_NUMBER: ${{ steps.release_info.outputs.build_number }}
    run: |
      set -euo pipefail

      flutter build apk \
        --release \
        --target-platform android-arm64 \
        --build-name "$APP_VERSION" \
        --build-number "$BUILD_NUMBER"

      mkdir -p dist

      cp build/app/outputs/flutter-apk/app-release.apk \
        "dist/Bettbox-${APP_VERSION}-${{ inputs.release_type }}-arm64-v8a.apk"

  - name: Verify APK signature
    shell: bash
    run: |
      set -euo pipefail

      APK=$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)

      if [ -z "$APK" ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
        -type f -name apksigner -print -quit)

      if [ -z "$APKSIGNER" ]; then
        echo "ERROR: apksigner was not found."
        exit 1
      fi

      "$APKSIGNER" verify --verbose "$APK"

      echo "APK signature verification passed."

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Bettbox-Android-arm64-${{ inputs.release_type }}
      path: dist/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Publish GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ steps.release_info.outputs.tag }}
      name: ${{ steps.release_info.outputs.release_name }}
      prerelease: ${{ steps.release_info.outputs.prerelease }}
      make_latest: ${{ inputs.release_type == 'stable' && 'true' || 'false' }}
      fail_on_unmatched_files: true
      files: dist/*.apk
      body: |
        Bettbox Android build.

        - Application ID: com.appshub.bettbox.sky
        - Version: ${{ steps.release_info.outputs.version }}
        - Build number: ${{ steps.release_info.outputs.build_number }}
        - Architecture: arm64-v8a
        - Release type: ${{ inputs.release_type }}

        The APK is signed with the configured Android signing key.