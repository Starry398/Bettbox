name: apk

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bettbox-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ !contains(github.ref, '-') || contains(github.ref_name, 'pre') }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 28.2.13676358
          add-to-path: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE" | base64 --decode \
            > android/app/keystore.jks

          test -s android/app/keystore.jks

          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } >> android/local.properties

          echo "Custom signing configuration written."

      - name: Verify Android signing
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -s android/app/keystore.jks

          keytool -list \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Keystore and alias verified."

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 '^version:' pubspec.yaml | \
            sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from pubspec.yaml."
            exit 1
          fi

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-custom.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Configure custom package ID
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/applicationId = "com.appshub.bettbox"/applicationId = "com.appshub.bettbox.custom"/' \
            android/app/build.gradle.kts

          grep -q \
            'applicationId = "com.appshub.bettbox.custom"' \
            android/app/build.gradle.kts

      - name: Configure version
        shell: bash
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}
        run: |
          set -euo pipefail

          sed -i -E \
            "s/^version: .*/version: ${APP_VERSION}+${BUILD_NUMBER}/" \
            pubspec.yaml

      - name: Flutter clean
        run: flutter clean

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Bettbox Android
        run: dart setup.dart android --arch arm64 --env stable

      - name: Build release APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-number "${{ steps.app_version.outputs.build_number }}" \
            --build-name "${{ steps.app_version.outputs.version }}"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/Bettbox-${{ steps.app_version.outputs.version }}-custom.${{ steps.app_version.outputs.build_number }}-arm64-v8a.apk"

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            echo "WARNING: apksigner not found; APK signature verification skipped."
          fi

          echo "APK generated: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bettbox-Android-arm64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: Bettbox ${{ steps.app_version.outputs.version }} custom.${{ steps.app_version.outputs.build_number }}
          body: |
            Custom Bettbox Android ARM64 build.

            - Architecture: arm64-v8a
            - Application ID: com.appshub.bettbox.custom
            - Version: ${{ steps.app_version.outputs.version }}
            - Build number: ${{ steps.app_version.outputs.build_number }}

            Signed using the repository's configured Android signing key.
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true