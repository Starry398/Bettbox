name: Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

concurrency:
  group: bettbox-sync
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  UPSTREAM_REPO: appshubcc/Bettbox
  CUSTOM_REPO: Starry398/Bettbox

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Get latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" \
            --jq '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not find the latest stable release."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG"

      - name: Check whether this release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$CUSTOM_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Bettbox Android ARM64
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: appshubcc/Bettbox
          ref: ${{ needs.check-release.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1

      - name: Checkout custom files
        uses: actions/checkout@v4
        with:
          repository: Starry398/Bettbox
          ref: main
          path: custom-files
          sparse-checkout: |
            starry/xml
            starry/images
          sparse-checkout-cone-mode: true

      - name: Apply custom resources
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          # Apply custom XML files.
          XML_SOURCE="../custom-files/starry/xml"
          XML_TARGET="android/app/src/main/res/drawable"

          mkdir -p "$XML_TARGET"

          for file in \
            splash_text_dark.xml \
            splash_text_light.xml \
            ic_launcher_foreground_dark.xml \
            ic_launcher_foreground_light.xml; do
            if [ ! -f "$XML_SOURCE/$file" ]; then
              echo "::error::Missing custom XML: $XML_SOURCE/$file"
              exit 1
            fi

            cp "$XML_SOURCE/$file" "$XML_TARGET/$file"
            echo "Applied custom XML: $file"
          done

          # Apply custom About-page icon.
          ICON_SOURCE="../custom-files/starry/images/icon.png"
          ICON_TARGET="assets/images/icon.png"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "::error::Custom icon not found: $ICON_SOURCE"
            exit 1
          fi

          if [ ! -f "$ICON_TARGET" ]; then
            echo "::error::Upstream icon not found: $ICON_TARGET"
            exit 1
          fi

          cp "$ICON_SOURCE" "$ICON_TARGET"
          echo "Applied custom icon: $ICON_TARGET"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Android build environment
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          NDK="${ANDROID_NDK_HOME:-}"

          if [ -z "$NDK" ]; then
            NDK=$(find "$SDK/ndk" \
              -mindepth 1 -maxdepth 1 -type d \
              | sort -V | tail -n 1)
          fi

          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::Android NDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "Using Android SDK: $SDK"
          echo "Using Android NDK: $NDK"

      - name: Configure custom application ID
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle"
          KTS_FILE="android/app/build.gradle.kts"

          if [ -f "$GRADLE_FILE" ]; then
            sed -i \
              's/com\.appshub\.bettbox/com.appshub.bettbox.starry/g' \
              "$GRADLE_FILE"
          elif [ -f "$KTS_FILE" ]; then
            sed -i \
              's/com\.appshub\.bettbox/com.appshub.bettbox.starry/g' \
              "$KTS_FILE"
          else
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          if ! grep -R -q \
            'com\.appshub\.bettbox\.starry' \
            android/app; then
            echo "::error::Custom application ID was not applied."
            exit 1
          fi

      - name: Configure version
        working-directory: upstream
        env:
          UPSTREAM_TAG: ${{ needs.check-release.outputs.upstream_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${UPSTREAM_TAG#v}"
          VERSION="${VERSION#V}"

          if ! grep -q '^version:' pubspec.yaml; then
            echo "::error::Could not find version in pubspec.yaml."
            exit 1
          fi

          sed -i \
            -E "s/^version:.*/version: ${VERSION}+${RUN_NUMBER}/" \
            pubspec.yaml

          grep '^version:' pubspec.yaml

      - name: Install Flutter dependencies
        working-directory: upstream
        run: |
          flutter clean
          flutter pub get

      - name: Generate project files
        working-directory: upstream
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android ARM64 APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          dart setup.dart android --arch arm64 --env stable

          echo "Generated APK files:"
          find . -type f -name '*.apk' -print

      - name: Collect APK
        id: apk
        working-directory: upstream
        env:
          UPSTREAM_TAG: ${{ needs.check-release.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find . -type f -name '*.apk' \
            -path '*/build/*' \
            ! -name '*debug*' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No release APK was found."
            exit 1
          fi

          mkdir -p ../release-files

          OUTPUT="../release-files/Bettbox-${UPSTREAM_TAG}-arm64.apk"
          cp "$APK" "$OUTPUT"

          echo "path=release-files/$(basename "$OUTPUT")" \
            >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bettbox-${{ needs.check-release.outputs.upstream_tag }}-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-release.outputs.upstream_tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" "$APK_PATH" \
            --repo "$CUSTOM_REPO" \
            --title "Bettbox $TAG (Starry)" \
            --notes "自编译 Bettbox Android ARM64 版本。

          - 上游版本：$TAG
          - 自定义包名：com.appshub.bettbox.starry
          - 包含自定义图标与资源

          源码：https://github.com/Starry398/Bettbox
          上游：https://github.com/appshubcc/Bettbox"