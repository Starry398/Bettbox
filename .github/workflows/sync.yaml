name: Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bettbox-release
  cancel-in-progress: false

jobs:
  check-release:
    name: Check upstream stable release
    runs-on: ubuntu-24.04

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - name: Find latest stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/appshubcc/Bettbox/releases/latest)

          TAG=$(echo "$RELEASE" | jq -er '.tag_name')

          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream stable release tag: $TAG"
            exit 1
          fi

          VERSION_NAME="${TAG#v}"

          echo "Upstream release tag: $TAG"
          echo "Version name: $VERSION_NAME"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
            --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists in this repository."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish stable release
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'

    uses: ./.github/workflows/shared.yaml

    permissions:
      contents: write

    with:
      source_tag: ${{ needs.check-release.outputs.tag }}
      version_name: ${{ needs.check-release.outputs.version_name }}
      release_tag: ${{ needs.check-release.outputs.tag }}
      prerelease: false

    secrets: inherit