name: Check

on:
  workflow_dispatch:

  push:
    paths:
      - "starry/patch/**"
      - ".github/workflows/check.yaml"

  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: bettbox-check-patches
  cancel-in-progress: true

jobs:
  check:
    name: Check Patch Applicability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Bettbox
        uses: actions/checkout@v4
        with:
          repository: appshubcc/Bettbox
          fetch-depth: 1
          path: upstream

      - name: Checkout Custom Patch Files
        uses: actions/checkout@v4
        with:
          repository: Starry398/Bettbox
          ref: ${{ github.ref }}
          fetch-depth: 1
          sparse-checkout: |
            starry/patch
          path: custom

      - name: Validate Patch Directory
        shell: bash
        run: |
          set -euo pipefail

          PATCH_DIR="custom/starry/patch"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "::error::Patch directory not found: $PATCH_DIR"
            exit 1
          fi

          mapfile -t PATCHES < <(
            find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' \
              -printf '%f\n' | sort
          )

          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "::error::No .patch files found in $PATCH_DIR"
            exit 1
          fi

          echo "Found ${#PATCHES[@]} patch file(s):"
          printf ' - %s\n' "${PATCHES[@]}"

      - name: Check Patch Applicability
        shell: bash
        run: |
          set -euo pipefail

          PATCH_DIR="$GITHUB_WORKSPACE/custom/starry/patch"
          UPSTREAM_DIR="$GITHUB_WORKSPACE/upstream"

          mapfile -t PATCHES < <(
            find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' \
              -printf '%f\n' | sort
          )

          cd "$UPSTREAM_DIR"

          for PATCH_NAME in "${PATCHES[@]}"; do
            PATCH_FILE="$PATCH_DIR/$PATCH_NAME"

            echo ""
            echo "========================================"
            echo "Checking: $PATCH_NAME"
            echo "========================================"

            if git apply --check "$PATCH_FILE"; then
              echo "PASS: $PATCH_NAME can be applied."
            else
              echo "::error title=Patch check failed::$PATCH_NAME cannot be applied to the current upstream source."
              exit 1
            fi

            git apply "$PATCH_FILE"
          done

          echo ""
          echo "========================================"
          echo "All patches can be applied successfully."
          echo "========================================"