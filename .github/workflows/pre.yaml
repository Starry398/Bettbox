name: Pre

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bettbox-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare pre-release version
    runs-on: ubuntu-24.04

    outputs:
      source_tag: ${{ steps.version.outputs.source_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Calculate next pre-release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching latest stable upstream release..."

          RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/appshubcc/Bettbox/releases/latest)

          SOURCE_TAG=$(echo "$RELEASE" | jq -er '.tag_name')

          if ! [[ "$SOURCE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream stable release tag: $SOURCE_TAG"
            exit 1
          fi

          BASE_VERSION="${SOURCE_TAG#v}"
          PREFIX="${BASE_VERSION}-pre."

          echo "Upstream stable tag: $SOURCE_TAG"
          echo "Base version: $BASE_VERSION"

          echo "Fetching existing releases from this repository..."

          RELEASE_TAGS=$(gh api \
            --paginate \
            "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')

          MAX_PRE=0

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            if [[ "$tag" =~ ^v?${BASE_VERSION//./\\.}-pre\.([0-9]+)$ ]]; then
              NUMBER="${BASH_REMATCH[1]}"

              # Avoid interpreting leading zeros as octal.
              NUMBER=$((10#$NUMBER))

              if (( NUMBER > MAX_PRE )); then
                MAX_PRE=$NUMBER
              fi
            fi
          done <<< "$RELEASE_TAGS"

          NEXT_PRE=$((MAX_PRE + 1))
          VERSION_NAME="${PREFIX}${NEXT_PRE}"
          RELEASE_TAG="v${VERSION_NAME}"

          echo "Previous highest pre-release number: $MAX_PRE"
          echo "Next version: $VERSION_NAME"
          echo "Release tag: $RELEASE_TAG"

          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish pre-release
    needs: prepare

    uses: ./.github/workflows/shared.yaml

    permissions:
      contents: write

    with:
      source_tag: ${{ needs.prepare.outputs.source_tag }}
      version_name: ${{ needs.prepare.outputs.version_name }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      prerelease: true

    secrets: inherit